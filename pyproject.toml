[project]
name = "metalab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
metalab = "metalab:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # Ошибки стиля pycodestyle
    "F",  # Pyflakes
    "I",  # Сортировка импортов
    "B",  # Bugbear
    "UP", # Современный синтаксис Python
]

[tool.ruff.format]
quote-style = "double"